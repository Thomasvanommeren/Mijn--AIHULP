<!DOCTYPE html>
<html lang="nl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Proteus AI Assistent</title>

  <style>

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      height: 100vh;
    }

    header {
      background: #222;
      color: white;
      padding: 20px;
      font-size: 22px;
      font-weight: bold;
    }

    #loginScreen,
    #chatScreen {
      height: calc(100vh - 70px);
    }

    #loginScreen {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #loginBox {
      background: white;
      padding: 30px;
      border-radius: 12px;
      width: 300px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    input {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      box-sizing: border-box;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    button {
      margin-top: 10px;
      padding: 12px;
      width: 100%;
      border: none;
      border-radius: 8px;
      background: #222;
      color: white;
      cursor: pointer;
    }

    #chat {
      height: calc(100vh - 150px);
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 75%;
      padding: 12px 15px;
      border-radius: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .user {
      align-self: flex-end;
      background: #007aff;
      color: white;
    }

    .bot {
      align-self: flex-start;
      background: white;
      border: 1px solid #ddd;
    }

    #inputArea {
      display: flex;
      padding: 15px;
      background: white;
      border-top: 1px solid #ddd;
      gap: 10px;
    }

    #vraag {
      flex: 1;
    }

    #error {
      color: red;
      margin-top: 10px;
    }

  </style>
</head>

<body>

<header>
  Proteus AI Assistent
</header>

<!-- LOGIN -->

<div id="loginScreen">

  <div id="loginBox">

    <h2>Login</h2>

    <input
      type="password"
      id="Proteus2026"
      placeholder="Wachtwoord!"
    >

    <button onclick="login()">
      Inloggen
    </button>

    <div id="error"></div>

  </div>

</div>

<!-- CHAT -->

<div id="chatScreen" style="display:none;">

  <div id="chat">

    <div class="message bot">
      Hey, ik ben Thomas 2.0 👋
      <br><br>
      Stel je vraag over Proteus.
    </div>

  </div>

  <div id="inputArea">

    <input
      id="vraag"
      type="text"
      placeholder="Typ je vraag..."
    >

    <button onclick="ask()">
      Verstuur
    </button>

  </div>

</div>

<script>

  const vraagInput = document.getElementById("vraag");
  const chat = document.getElementById("chat");

  // Sessie controleren
  if (localStorage.getItem("loggedIn") === "true") {
    showChat();
  }

  function login() {

    const password =
      document.getElementById("password").value;

    // Tijdelijk hardcoded
    // later via API veiliger maken

    if (password === "Proteus2026!") {

      localStorage.setItem("loggedIn", "true");

      showChat();

    } else {

      document.getElementById("error").innerText =
        "Onjuist wachtwoord";

    }
  }

  function showChat() {

    document.getElementById("loginScreen").style.display = "none";

    document.getElementById("chatScreen").style.display = "block";
  }

  // ENTER versturen
  vraagInput?.addEventListener("keypress", function(event) {

    if (event.key === "Enter") {
      event.preventDefault();
      ask();
    }

  });

  function addMessage(text, type) {

    const div = document.createElement("div");

    div.classList.add("message");
    div.classList.add(type);

    div.innerText = text;

    chat.appendChild(div);

    chat.scrollTop = chat.scrollHeight;

    return div;
  }

  async function ask() {

    const vraag = vraagInput.value.trim();

    if (!vraag) return;

    addMessage(vraag, "user");

    vraagInput.value = "";

    const loadingMessage = addMessage(
      "Thomas 2.0 denkt even na...",
      "bot"
    );

    try {

      const res = await fetch("/api/ask", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ vraag })
      });

      const data = await res.json();

      loadingMessage.remove();

      if (!res.ok) {

        addMessage(
          "Serverfout:\n\n" +
          (data.details || data.error || "Onbekende fout"),
          "bot"
        );

        return;
      }

      addMessage(
        data.antwoord || "Geen antwoord ontvangen.",
        "bot"
      );

    } catch (error) {

      loadingMessage.remove();

      addMessage(
        "Er ging iets mis met de verbinding.",
        "bot"
      );
    }
  }

</script>

</body>
</html>
