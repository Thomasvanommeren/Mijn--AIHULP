<!DOCTYPE html>
<html lang="nl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Thomas 2.0 - Proteus Goeroe</title>

  <style>

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      background: #222;
      color: white;
      padding: 20px;
      font-size: 22px;
      font-weight: bold;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 75%;
      padding: 12px 15px;
      border-radius: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .user {
      align-self: flex-end;
      background: #007aff;
      color: white;
    }

    .bot {
      align-self: flex-start;
      background: white;
      border: 1px solid #ddd;
    }

    #inputArea {
      display: flex;
      padding: 15px;
      background: white;
      border-top: 1px solid #ddd;
      gap: 10px;
    }

    #vraag {
      flex: 1;
      padding: 12px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    button {
      padding: 12px 20px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #222;
      color: white;
    }

    button:hover {
      opacity: 0.9;
    }

    .loading {
      opacity: 0.7;
      font-style: italic;
    }

  </style>
</head>

<body>

  <header>
    Thomas 2.0 - Proteus Goeroe
  </header>

  <div id="chat">

    <div class="message bot">
      Hey, ik ben Thomas 2.0 👋<br><br>
      Stel je vraag over Proteus.
    </div>

  </div>

  <div id="inputArea">

    <input
      id="vraag"
      type="text"
      placeholder="Typ je vraag over Proteus..."
    >

    <button onclick="ask()">
      Verstuur
    </button>

  </div>

  <script>

    const vraagInput = document.getElementById("vraag");
    const chat = document.getElementById("chat");

    // ENTER versturen
    vraagInput.addEventListener("keypress", function(event) {

      if (event.key === "Enter") {
        event.preventDefault();
        ask();
      }

    });

    function addMessage(text, type) {

      const div = document.createElement("div");

      div.classList.add("message");
      div.classList.add(type);

      div.innerText = text;

      chat.appendChild(div);

      // auto scroll naar beneden
      chat.scrollTop = chat.scrollHeight;

      return div;
    }

    async function ask() {

      const vraag = vraagInput.value.trim();

      if (!vraag) return;

      // Vraag gebruiker tonen
      addMessage(vraag, "user");

      // Input leegmaken
      vraagInput.value = "";

      // Loading bericht
      const loadingMessage = addMessage(
        "Thomas 2.0 denkt even na...",
        "bot"
      );

      loadingMessage.classList.add("loading");

      try {

        const res = await fetch("/api/ask", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ vraag })
        });

        const data = await res.json();

        // loading vervangen
        loadingMessage.remove();

        if (!res.ok) {

          addMessage(
            "Serverfout:\n\n" +
            (data.details || data.error || "Onbekende fout"),
            "bot"
          );

          return;
        }

        addMessage(
          data.antwoord || "Geen antwoord ontvangen.",
          "bot"
        );

      } catch (error) {

        console.error(error);

        loadingMessage.remove();

        addMessage(
          "Er ging iets mis met de verbinding.",
          "bot"
        );
      }
    }

  </script>

</body>
</html>
