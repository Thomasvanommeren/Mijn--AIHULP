<!DOCTYPE html>
<html lang="nl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Proteus AI Assistent</title>

  <style>

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #e6f2ff;
      height: 100vh;
    }


    #appShell {
      width: 80%;
      margin: 0 auto;
      min-height: 100vh;
      background: #f2f2f2;
      box-shadow: 0 0 18px rgba(0,0,0,0.06);
    }

    header {
      background: #222;
      color: white;
      padding: 20px;
      font-size: 22px;
      font-weight: bold;
    }

    #loginScreen,
    #chatScreen {
      height: calc(100vh - 70px);
    }

    #chatScreen {
      height: calc(100vh - 70px);
      display: flex;
      flex-direction: column;
    }

    #loginScreen {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #loginBox {
      background: white;
      padding: 30px;
      border-radius: 12px;
      width: 320px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    input {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      box-sizing: border-box;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px 20px 180px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 72%;
      padding: 12px 15px;
      border-radius: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .message.image-preview {
      padding: 8px;
      background: transparent;
      border: none;
    }

    .message.image-preview img {
      width: min(320px, 100%);
      border-radius: 10px;
      border: 1px solid rgba(0,0,0,0.12);
      display: block;
    }

    .user {
      align-self: flex-end;
      background: #007aff;
      color: white;
    }

    .bot {
      align-self: flex-start;
      background: white;
      border: 1px solid #ddd;
    }

    #inputArea {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: 16px;
      width: min(76%, 1100px);
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      padding: 12px;
      background: rgba(255,255,255,0.97);
      border: 1px solid #d7e2ee;
      border-radius: 14px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.12);
      gap: 10px;
      align-items: stretch;
      backdrop-filter: blur(4px);
      z-index: 20;
    }

    #composeRow {
      display: flex;
      gap: 10px;
      align-items: flex-end;
      width: 100%;
    }

    #vraag {
      flex: 1;
      padding: 14px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 10px;
      min-height: 55px;
      font-family: Arial, sans-serif;
      resize: none;
      box-sizing: border-box;
    }

    #uploadRow {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    #imageName {
      font-size: 14px;
      color: #555;
    }

    #pendingPreview {
      position: relative;
      align-self: flex-start;
      margin-top: 4px;
    }

    #pendingPreviewImg {
      width: min(260px, 60vw);
      max-height: 180px;
      object-fit: contain;
      border-radius: 10px;
      border: 1px solid #d7e2ee;
      background: #fff;
      display: block;
    }

    #removePreviewBtn {
      position: absolute;
      top: -8px;
      right: -8px;
      width: 26px;
      min-width: 26px;
      height: 26px;
      padding: 0;
      border-radius: 50%;
      background: #1e1e1e;
      color: #fff;
      font-size: 18px;
      line-height: 1;
    }


    button {
      padding: 14px 22px;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      background: #222;
      color: white;
      cursor: pointer;
      min-width: 120px;
    }

    button:hover {
      opacity: 0.9;
    }

    #error {
      color: red;
      margin-top: 10px;
    }

  </style>
</head>

<body>

<div id="appShell">

<header>
  Proteus AI Assistent
</header>

<div id="loginScreen">

  <div id="loginBox">

    <h2>Login</h2>

    <input
      type="password"
      id="password"
      placeholder="Wachtwoord"
    >

    <button onclick="login()">
      Inloggen
    </button>

    <div id="error"></div>

  </div>

</div>

<div id="chatScreen" style="display:none;">

  <div id="chat">

    <div class="message bot">
      Hey, ik ben Thomas 2.0 👋
      <br><br>
      Stel je vraag over Proteus.
    </div>

  </div>

  <div id="inputArea">
    <div id="uploadRow">
      <input type="file" id="imageInput" accept="image/*">
      <span id="imageName">Geen screenshot geselecteerd</span>
    </div>

    <div id="pendingPreview" style="display:none;">
      <img id="pendingPreviewImg" alt="Screenshot preview">
      <button id="removePreviewBtn" type="button">×</button>
    </div>

    <div id="composeRow">
      <textarea
        id="vraag"
        placeholder="Typ je vraag..."
      ></textarea>

      <button onclick="ask()">
        Verstuur
      </button>
    </div>
  </div>

</div>

<script>

  const vraagInput = document.getElementById("vraag");
  const imageInput = document.getElementById("imageInput");
  const imageName = document.getElementById("imageName");
  const pendingPreview = document.getElementById("pendingPreview");
  const pendingPreviewImg = document.getElementById("pendingPreviewImg");
  const removePreviewBtn = document.getElementById("removePreviewBtn");
  const chat = document.getElementById("chat");
  let conversationHistory = [];
  let pastedImageDataUrl = null;

  if (localStorage.getItem("loggedIn") === "true") {
    showChat();
  }

  imageInput?.addEventListener("change", () => {
    const file = imageInput.files?.[0];

    if (file) {
      pastedImageDataUrl = null;
    }

    imageName.textContent = file
      ? `Screenshot: ${file.name}`
      : "Geen screenshot geselecteerd";

    if (file) {
      readImageAsDataUrl(file).then(renderPendingPreview);
    } else {
      renderPendingPreview(null);
    }
  });

  vraagInput?.addEventListener("paste", async (event) => {
    const file = getImageFromClipboard(event);

    if (!file) {
      return;
    }

    event.preventDefault();

    pastedImageDataUrl = await readImageAsDataUrl(file);
    imageInput.value = "";
    imageName.textContent = "Screenshot: geplakt met Ctrl+V";
    renderPendingPreview(pastedImageDataUrl);
  });

  removePreviewBtn?.addEventListener("click", () => {
    clearPendingScreenshot();
  });

  function login() {

    const password =
      document.getElementById("password").value;

    if (password === "Proteus2026!") {

      localStorage.setItem("loggedIn", "true");

      showChat();

    } else {

      document.getElementById("error").innerText =
        "Onjuist wachtwoord";

    }
  }

  function showChat() {

    document.getElementById("loginScreen").style.display = "none";

    document.getElementById("chatScreen").style.display = "block";
  }

  vraagInput?.addEventListener("keydown", function(event) {

    if (event.key === "Enter" && !event.shiftKey) {

      event.preventDefault();

      ask();
    }

  });


  function getImageFromClipboard(event) {
    const clipboardData = event.clipboardData;

    if (!clipboardData) return null;

    const files = Array.from(clipboardData.files || []);
    const imageFile = files.find((file) => file.type.startsWith("image/"));

    if (imageFile) return imageFile;

    const items = Array.from(clipboardData.items || []);

    for (const item of items) {
      if (!item.type.startsWith("image/")) continue;

      const file = item.getAsFile();
      if (file) return file;
    }

    return null;
  }

  function addMessage(text, type) {

    const div = document.createElement("div");

    div.classList.add("message");
    div.classList.add(type);

    div.innerText = text;

    chat.appendChild(div);

    chat.scrollTop = chat.scrollHeight;

    return div;
  }

  function renderPendingPreview(imageDataUrl) {
    if (!imageDataUrl) {
      pendingPreview.style.display = "none";
      pendingPreviewImg.removeAttribute("src");
      return;
    }

    pendingPreviewImg.src = imageDataUrl;
    pendingPreview.style.display = "block";
  }

  function clearPendingScreenshot() {
    imageInput.value = "";
    pastedImageDataUrl = null;
    imageName.textContent = "Geen screenshot geselecteerd";
    renderPendingPreview(null);
  }


  function readImageAsDataUrl(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  async function ask() {

    const vraag = vraagInput.value.trim();
    const selectedImage = imageInput.files?.[0];

    if (!vraag && !selectedImage && !pastedImageDataUrl) return;

    let loadingMessage = null;

    try {
      const imageDataUrl = selectedImage
        ? await readImageAsDataUrl(selectedImage)
        : pastedImageDataUrl;

      if (vraag) {
        addMessage(vraag, "user");
      } else {
        addMessage("[Screenshot verstuurd zonder tekst]", "user");
      }

      vraagInput.value = "";

      loadingMessage = addMessage(
        "Thomas 2.0 denkt even na...",
        "bot"
      );

      const res = await fetch("/api/ask", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          vraag,
          history: conversationHistory,
          screenshot: imageDataUrl
        })
      });

      const data = await res.json();

      loadingMessage.remove();

      if (!res.ok) {

        addMessage(
          "Serverfout:\n\n" +
          (data.details || data.error || "Onbekende fout"),
          "bot"
        );

        return;
      }

      const antwoord = data.antwoord || "Geen antwoord ontvangen.";
      addMessage(antwoord, "bot");

      if (vraag) {
        conversationHistory.push({ role: "user", content: vraag });
      }
      conversationHistory.push({ role: "assistant", content: antwoord });

      clearPendingScreenshot();

    } catch (error) {

      if (loadingMessage) {
        loadingMessage.remove();
      }

      addMessage(
        "Er ging iets mis met de verbinding.",
        "bot"
      );
    }
  }

</script>

</div>

</body>
</html>
