<!DOCTYPE html>
<html lang="nl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Proteus AI Assistent</title>

  <style>

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      height: 100vh;
    }

    header {
      background: #222;
      color: white;
      padding: 20px;
      font-size: 22px;
      font-weight: bold;
    }

    #loginScreen,
    #chatScreen {
      height: calc(100vh - 70px);
    }

    #loginScreen {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #loginBox {
      background: white;
      padding: 30px;
      border-radius: 12px;
      width: 320px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    input {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      box-sizing: border-box;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    #chat {
      height: calc(100vh - 230px);
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 75%;
      padding: 12px 15px;
      border-radius: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .user {
      align-self: flex-end;
      background: #007aff;
      color: white;
    }

    .bot {
      align-self: flex-start;
      background: white;
      border: 1px solid #ddd;
    }

    #inputArea {
      display: flex;
      flex-direction: column;
      padding: 15px;
      background: white;
      border-top: 1px solid #ddd;
      gap: 10px;
    }

    #composeRow {
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    #vraag {
      flex: 1;
      padding: 14px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 10px;
      min-height: 55px;
      font-family: Arial, sans-serif;
      resize: none;
      box-sizing: border-box;
    }

    #uploadRow {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    #imageName {
      font-size: 14px;
      color: #555;
    }

    button {
      padding: 14px 22px;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      background: #222;
      color: white;
      cursor: pointer;
      min-width: 120px;
    }

    button:hover {
      opacity: 0.9;
    }

    #error {
      color: red;
      margin-top: 10px;
    }

  </style>
</head>

<body>

<header>
  Proteus AI Assistent
</header>

<div id="loginScreen">

  <div id="loginBox">

    <h2>Login</h2>

    <input
      type="password"
      id="password"
      placeholder="Wachtwoord"
    >

    <button onclick="login()">
      Inloggen
    </button>

    <div id="error"></div>

  </div>

</div>

<div id="chatScreen" style="display:none;">

  <div id="chat">

    <div class="message bot">
      Hey, ik ben Thomas 2.0 👋
      <br><br>
      Stel je vraag over Proteus.
    </div>

  </div>

  <div id="inputArea">
    <div id="uploadRow">
      <input type="file" id="imageInput" accept="image/*">
      <span id="imageName">Geen screenshot geselecteerd</span>
    </div>

    <div id="composeRow">
      <textarea
        id="vraag"
        placeholder="Typ je vraag..."
      ></textarea>

      <button onclick="ask()">
        Verstuur
      </button>
    </div>
  </div>

</div>

<script>

  const vraagInput = document.getElementById("vraag");
  const imageInput = document.getElementById("imageInput");
  const imageName = document.getElementById("imageName");
  const chat = document.getElementById("chat");
  let conversationHistory = [];

  if (localStorage.getItem("loggedIn") === "true") {
    showChat();
  }

  imageInput?.addEventListener("change", () => {
    const file = imageInput.files?.[0];
    imageName.textContent = file
      ? `Screenshot: ${file.name}`
      : "Geen screenshot geselecteerd";
  });

  function login() {

    const password =
      document.getElementById("password").value;

    if (password === "Proteus2026!") {

      localStorage.setItem("loggedIn", "true");

      showChat();

    } else {

      document.getElementById("error").innerText =
        "Onjuist wachtwoord";

    }
  }

  function showChat() {

    document.getElementById("loginScreen").style.display = "none";

    document.getElementById("chatScreen").style.display = "block";
  }

  vraagInput?.addEventListener("keydown", function(event) {

    if (event.key === "Enter" && !event.shiftKey) {

      event.preventDefault();

      ask();
    }

  });

  function addMessage(text, type) {

    const div = document.createElement("div");

    div.classList.add("message");
    div.classList.add(type);

    div.innerText = text;

    chat.appendChild(div);

    chat.scrollTop = chat.scrollHeight;

    return div;
  }

  function readImageAsDataUrl(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  async function ask() {

    const vraag = vraagInput.value.trim();
    const selectedImage = imageInput.files?.[0];

    if (!vraag && !selectedImage) return;

    if (vraag) {
      addMessage(vraag, "user");
    } else {
      addMessage("[Screenshot verstuurd zonder tekst]", "user");
    }

    vraagInput.value = "";

    const loadingMessage = addMessage(
      "Thomas 2.0 denkt even na...",
      "bot"
    );

    try {
      const imageDataUrl = selectedImage
        ? await readImageAsDataUrl(selectedImage)
        : null;

      const res = await fetch("/api/ask", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          vraag,
          history: conversationHistory,
          screenshot: imageDataUrl
        })
      });

      const data = await res.json();

      loadingMessage.remove();

      if (!res.ok) {

        addMessage(
          "Serverfout:\n\n" +
          (data.details || data.error || "Onbekende fout"),
          "bot"
        );

        return;
      }

      const antwoord = data.antwoord || "Geen antwoord ontvangen.";
      addMessage(antwoord, "bot");

      if (vraag) {
        conversationHistory.push({ role: "user", content: vraag });
      }
      conversationHistory.push({ role: "assistant", content: antwoord });

      imageInput.value = "";
      imageName.textContent = "Geen screenshot geselecteerd";

    } catch (error) {

      loadingMessage.remove();

      addMessage(
        "Er ging iets mis met de verbinding.",
        "bot"
      );
    }
  }

</script>

</body>
</html>
